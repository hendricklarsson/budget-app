<!doctype html>
<html lang="en-MY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sen Tracker</title>
  <meta name="description" content="Know where every ringgit goes, in plain words.">
  <link rel="preload" href="fonts/Geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">

  <!-- Installable app: name, icons and colours for phones. -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png?v=9">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=9">
  <meta name="apple-mobile-web-app-title" content="Sen Tracker">
  <meta name="theme-color" content="#07080b">

  <!-- "defer" runs the scripts in this order after the page is parsed:
       Google's sign-in library, our settings, the encryption, the PDF
       statement maker, the app, then the passphrase screens. The app starts
       once they have all loaded. -->
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="config.js" defer></script>
  <script src="crypto.js" defer></script>
  <script src="statement.js" defer></script>
  <script src="app.js" defer></script>
  <script src="passphrase.js" defer></script>
</head>
<body data-wash="signin">

  <!-- The coloured wash behind every screen. app.js sets body[data-wash]. -->
  <div class="mesh" aria-hidden="true"></div>

  <!-- ================= Sign In ================= -->
  <main id="signin-screen" class="signin" hidden>
    <span class="mark" aria-hidden="true">sen</span>
    <h1 class="title">Know Where Every <span class="sub">Ringgit Goes</span></h1>
    <p class="lede">Add what you spend. See it by day, month and year.</p>
    <div class="spacer"></div>

    <div id="signin-message" class="notice" hidden></div>
    <div id="google-button" class="google-button"></div>
    <button id="demo-button" type="button" class="btn btn-secondary btn-block">Try the Demo, No Sign-In</button>

    <!-- On a 94% solid plate, so its contrast never depends on the glow. -->
    <div class="card privacy-plate">
      <span class="line"><span data-icon="lock"></span>Your entries are encrypted on your phone.</span>
      <span style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 12px">
        <button id="signin-see" type="button" class="link-button big">What the Developer Can See</button>
        <a class="link-button big" href="privacy.html">Privacy Policy</a>
      </span>
    </div>
  </main>

  <!-- ================= Passphrase, recovery code and recovery screens =================
       Filled in by passphrase.js. No tab bar here: each step has one way on. -->
  <main id="vault-screen" class="vault" hidden></main>

  <!-- ================= The app (after sign-in, or in demo mode) ================= -->
  <div id="app-screen" hidden>
    <main id="app-main" class="app">

      <!-- Overview: filled in by renderOverview() in app.js -->
      <section id="screen-overview" class="screen" aria-labelledby="overview-title" hidden></section>

      <!-- History: filled in by renderHistory() -->
      <section id="screen-history" class="screen" aria-labelledby="history-title" hidden></section>

      <!-- Settings: filled in by renderSettings() -->
      <section id="screen-settings" class="screen" aria-labelledby="settings-title" hidden></section>

      <!-- Add Expense and Edit Expense share this one form. The order follows
           how people remember a purchase: how much, when, what it was, then
           the category. The tab bar is hidden here; the ways out are Save or
           Back. -->
      <section id="screen-form" class="screen" aria-labelledby="form-title" hidden>
        <div class="form-top">
          <button id="form-back" type="button" class="btn btn-secondary btn-icon" aria-label="Back"><span data-icon="back"></span></button>
          <span class="req-note"><span class="req" aria-hidden="true">*</span> Required</span>
        </div>
        <div id="form-demo-banner"></div>
        <h1 id="form-title" class="title"><span id="form-title-1">Add</span> <span id="form-title-2" class="sub plain">Expense</span></h1>

        <form id="expense-form" class="form" novalidate>
          <!-- The amount tile glows in the chosen category's colour. -->
          <label id="amount-card" class="amount-card" for="amount">
            <span class="top">
              <span class="k">Amount <span class="req" aria-hidden="true">*</span></span>
              <span id="amount-cat" class="cat-badge"></span>
            </span>
            <span class="amount-line">
              <span class="cur" aria-hidden="true">RM</span>
              <input id="amount" class="amount-input" type="text" inputmode="decimal" required aria-required="true"
                     autocomplete="off" placeholder="0.00" aria-describedby="amount-error">
            </span>
            <span id="amount-error" class="amount-error" role="alert" hidden><span id="amount-error-icon"></span><span id="amount-error-text">Type an amount first.</span></span>
          </label>

          <!-- When: the phone's own date and time pickers lie invisibly over these pills. -->
          <div id="when-pills" class="when-pills">
            <label id="date-pill" class="when-pill">
              <span class="ic"><span data-icon="calendar"></span></span>
              <span style="min-width:0"><span class="k">Date</span><span id="date-label" class="v">Today</span></span>
              <input id="date-input" type="date" aria-label="Date">
            </label>
            <label id="time-pill" class="when-pill">
              <span class="ic"><span data-icon="clock"></span></span>
              <span style="min-width:0"><span class="k">Time</span><span id="time-label" class="v"></span></span>
              <input id="time-input" type="time" aria-label="Time">
            </label>
            <label id="datetime-pill" class="when-pill" hidden>
              <span class="ic"><span data-icon="calendar"></span></span>
              <span style="min-width:0"><span class="k">Date and time</span><span id="datetime-label" class="v"></span></span>
              <input id="datetime-input" type="datetime-local" aria-label="Date and time">
            </label>
          </div>

          <div class="card details">
            <label class="note-row">
              <span class="k">Note</span>
              <input id="note" type="text" maxlength="200" autocomplete="off" placeholder="Add a note">
            </label>
            <!-- Receipt photo: a button to add one, or the photo with Replace / Remove. -->
            <input id="photo-input" type="file" accept="image/*" class="visually-hidden" tabindex="-1">
            <button id="photo-add" type="button" class="photo-add"><span data-icon="camera"></span><span class="grow">Add Receipt Photo</span><span class="opt">Optional</span></button>
            <div id="photo-has" class="photo-has" hidden>
              <button id="photo-view" type="button" class="photo-thumb-button" aria-label="View receipt photo"><img id="photo-thumb" class="photo-thumb" alt=""></button>
              <span class="grow">Receipt<br>photo</span>
              <button id="photo-replace" type="button" class="btn btn-secondary btn-small" hidden>Replace</button>
              <button id="photo-remove" type="button" class="btn btn-quiet-danger btn-small">Remove</button>
            </div>
          </div>

          <p id="category-label" class="category-label">Category <span class="req" aria-hidden="true">*</span></p>
          <!-- In Edit, the category is one row with Change, since it's already set. -->
          <button id="category-row" type="button" class="card category-row" aria-expanded="false" aria-controls="category-chips" hidden>
            <span id="category-row-tile" class="tile"></span>
            <span class="grow"><span class="k">Category <span class="req" aria-hidden="true">*</span></span><span id="category-value" class="v"></span></span>
            <span class="change">Change</span>
          </button>
          <!-- A radio group of capsules, built by app.js from CATEGORIES. -->
          <div id="category-chips" class="chips" role="radiogroup" aria-labelledby="category-label" aria-required="true"></div>

          <div class="form-spacer"></div>
          <div id="form-banner" class="notice notice-red" role="alert" hidden></div>
          <button id="save-button" type="submit" class="btn btn-primary btn-block form-submit">Save Expense</button>
        </form>
      </section>
    </main>

    <!-- Navigation: three labelled tabs in a dark pill, plus a separate Add. -->
    <nav id="tabbar" class="tabbar" aria-label="Main">
      <div class="tabs">
        <button type="button" class="tab" data-screen="overview"><span data-icon="home" data-size="22"></span>Home</button>
        <button type="button" class="tab" data-screen="history"><span data-icon="history" data-size="22"></span>History</button>
        <button type="button" class="tab" data-screen="settings"><span data-icon="settings" data-size="22"></span>Settings</button>
      </div>
      <button id="add-tab" type="button" class="add-tab" data-screen="add" aria-label="Add Expense"><span data-icon="plus" data-size="22"></span>Add</button>
    </nav>

    <!-- Replaces the tabs while choosing entries in History. -->
    <div id="selectbar" class="selectbar" hidden>
      <div class="bar">
        <button id="delete-selected" type="button" class="btn btn-danger" disabled>Select Entries First</button>
      </div>
    </div>

    <!-- Short messages, e.g. "2 entries deleted · Undo". -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- ================= Pop-ups =================
       <dialog> is built into browsers: showModal() opens it on top of the
       page, and the Escape key closes it. app.js fills in each one. -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="receipt-viewer" class="viewer" aria-labelledby="viewer-title"></dialog>
  <dialog id="page-dialog" class="page-dialog" aria-labelledby="page-title"></dialog>

</body>
</html>
